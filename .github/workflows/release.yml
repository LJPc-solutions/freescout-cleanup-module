name: Release

on:
    push:
        tags:
            - '*'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v3

            -   name: Prepare files
                run: |
                    mkdir Cleanup
                    # Move everything except .git and README.md into the Cleanup folder
                    find . -maxdepth 1 ! -name .git ! -name .github ! -name Cleanup ! -name . ! -name README.md -exec mv {} Cleanup/ \;

            -   name: Archive repository
                run: |
                    zip -r "${GITHUB_REF_NAME}.zip" Cleanup
                    cp "${GITHUB_REF_NAME}.zip" latest.zip

            -   name: Create version.txt
                run: echo "${GITHUB_REF_NAME}" > version.txt

            -   name: Upload to FTP
                uses: SamKirkland/FTP-Deploy-Action@4.2.0
                with:
                    server: ${{ secrets.FTP_SERVER }}
                    username: ${{ secrets.FTP_USERNAME }}
                    password: ${{ secrets.FTP_PASSWORD }}
                    local-dir: ./
                    server-dir: './'

            # The auto-generated "Source code" zips unpack to freescout-cleanup-module-<tag>,
            # which breaks FreeScout (the folder must be named Cleanup). Attach the correctly
            # structured zip to the release so users downloading from GitHub get a working one.
            -   name: Create GitHub release with module zip
                run: |
                    cp "${GITHUB_REF_NAME}.zip" "Cleanup-${GITHUB_REF_NAME}.zip"
                    gh release create "${GITHUB_REF_NAME}" "Cleanup-${GITHUB_REF_NAME}.zip" --title "${GITHUB_REF_NAME}" --notes "See the commit history for changes. Install using Cleanup-${GITHUB_REF_NAME}.zip (unpacks to the required Cleanup folder), not the auto-generated source code archives."
                env:
                    GH_TOKEN: ${{ github.token }}
